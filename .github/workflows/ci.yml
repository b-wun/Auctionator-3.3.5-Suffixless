name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lua lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck Auctionator/

  # ── 2. Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (busted / luacore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luabitop  # provides the `bit` module used by the addon

      - name: Run unit tests
        run: |
          busted --verbose \
            --pattern="_spec" \
            tests/spec/zcUtils_spec.lua \
            tests/spec/query_spec.lua

  # ── 3. E2E / integration tests ─────────────────────────────────────────────
  e2e-tests:
    name: E2E integration tests (AzerothCore mock environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luabitop

      - name: Run e2e integration tests
        run: |
          busted --verbose \
            --pattern="_spec" \
            tests/spec/e2e_spec.lua

  # ── 4. Build zip artifact ─────────────────────────────────────────────────
  build-zip:
    name: Build addon .zip
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Read addon version from .toc
        id: version
        run: |
          VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' Auctionator/Auctionator.toc | head -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine addon version from Auctionator/Auctionator.toc" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package addon folder into zip
        run: |
          zip -r "Auctionator-${{ steps.version.outputs.version }}.zip" Auctionator/

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Auctionator-${{ steps.version.outputs.version }}"
          path: "Auctionator-${{ steps.version.outputs.version }}.zip"
          retention-days: 30
